server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Uploaded font files can be a couple hundred KB; keep this generous.
    client_max_body_size 10m;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Custom error pages. These are plain PHP files served like any other
    # page (public/403.php, 404.php, 500.php) — no "internal" restriction,
    # so they also render correctly if someone opens them directly.
    error_page 403 /403.php;
    error_page 404 /404.php;
    error_page 500 502 503 504 /500.php;

    # This site is a flat set of real .php files (index.php, about.php,
    # generate.php, ...) rather than a router/front-controller, so an
    # unmatched URL is a genuine 404 — it must NOT fall back to index.php.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Everything outside public/ (src/, storage/, vendor/, composer.json)
    # is simply not under this server's document root, so it's already
    # unreachable — no extra "deny" rules needed.

    location ~* \.(ttf|otf)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
