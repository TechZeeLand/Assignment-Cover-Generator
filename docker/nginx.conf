server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;

    # Uploaded font files can be a couple hundred KB; keep this generous.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    error_page 502 503 504 /assets/service-unavailable.html;

    # Real files (assets) are served directly; every other URL goes to the PHP front controller
    # (public/index.php), which also handles the old *.php addresses (generate.php, about.php ...).
    location / {
        try_files $uri @app;
    }

    location @app {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # No PHP file is executed directly.
    location ~ \.php$ {
        try_files /nonexistent @app;
    }

    location ~* \.(ttf|otf|woff2?)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(svg|png|jpg|ico|css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
