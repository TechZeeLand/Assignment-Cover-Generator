server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Uploaded font files can be a couple hundred KB; keep this generous.
    client_max_body_size 10m;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Everything outside public/ (src/, storage/, vendor/, composer.json)
    # is simply not under this server's document root, so it's already
    # unreachable — no extra "deny" rules needed.

    location ~* \.(ttf|otf)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
