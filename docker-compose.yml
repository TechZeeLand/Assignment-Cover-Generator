services:
  assignment-cover-generator:
    # For Portainer's "Web editor" with a Git-linked stack, `build:` works directly.
    # To use the pre-built image instead, comment out `build:` and use:
    #   image: ghcr.io/techzeeland/assignment-cover-generator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tzl-acg
    restart: unless-stopped
    ports:
      - "1025:80"
    volumes:
      # Same volume names as before, so users, saved details, settings and custom fonts are kept.
      - acg_fonts:/var/www/html/storage/fonts
      - acg_data:/var/www/html/storage/data
    environment:
      TZ: UTC
      TZL_ROOT_DOMAIN: "${TZL_ROOT_DOMAIN:-rayaz.org}"
      TZL_BASE_URL: "${TZL_BASE_URL:-https://assignmentcovergenerator.rayaz.org}"
      TZL_TRUST_PROXY: "${TZL_TRUST_PROXY:-1}"
      TZL_ADMIN_USER: "${TZL_ADMIN_USER:-admin}"
      # Only used when no admin exists yet. Existing installs keep their current admin password.
      TZL_ADMIN_PASSWORD: "${TZL_ADMIN_PASSWORD:-}"
      # Old variables still work: ADMIN_PASSWORD (first admin) and ADMIN_PASSWORD_RESET=1 (lost password).
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_PASSWORD_RESET: "${ADMIN_PASSWORD_RESET:-}"

volumes:
  acg_fonts:
  acg_data:
